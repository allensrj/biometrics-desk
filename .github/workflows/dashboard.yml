name: Refresh and publish dashboard
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Collect fresh data before publishing
        type: boolean
        default: true
permissions: {}
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RADAR_STATE_DIR: ${{ runner.temp }}/radar-state
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name == 'schedule' || inputs.refresh
        with:
          path: |
            ${{ env.RADAR_STATE_DIR }}/seen_repos.json
            clinical.json
            repositories.json
            refresh-status.json
          key: radar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-v1-
      - name: Collect public sources
        if: github.event_name == 'schedule' || inputs.refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 -u refresh.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name == 'schedule' || inputs.refresh
        with:
          path: |
            ${{ env.RADAR_STATE_DIR }}/seen_repos.json
            clinical.json
            repositories.json
            refresh-status.json
          key: radar-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare public files
        run: |
          mkdir site
          cp index.html style.css app.js clinical.json repositories.json repositories-archive.json refresh-status.json site/
          chmod -R a+rX site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
