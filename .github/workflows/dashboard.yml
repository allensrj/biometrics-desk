name: Refresh and publish dashboard
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Collect fresh data before publishing
        type: boolean
        default: true
permissions: {}
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RADAR_STATE_DIR: /tmp/biometrics-desk-state
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name == 'schedule' || inputs.refresh
        with:
          path: |
            ${{ env.RADAR_STATE_DIR }}/seen_repos.json
            clinical.json
            repositories.json
            refresh-status.json
          key: radar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-v1-
      - name: Collect public sources
        if: github.event_name == 'schedule' || inputs.refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 -u refresh.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name == 'schedule' || inputs.refresh
        with:
          path: |
            ${{ env.RADAR_STATE_DIR }}/seen_repos.json
            clinical.json
            repositories.json
            refresh-status.json
          key: radar-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify interface on GitHub runner
        run: |
          node --check app.js
          python3 -m compileall -q refresh.py collector
          npm install --prefix "$RUNNER_TEMP/desk-ui" --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/desk-ui-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          DESK_UI_DIR="$RUNNER_TEMP/desk-ui" node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require(process.env.DESK_UI_DIR + '/node_modules/playwright-core');
          (async () => {
            const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const data = JSON.parse(fs.readFileSync('clinical.json', 'utf8'));
              const day = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Shanghai' }).format(new Date());
              const fixture = { title: '事项定位检查', category: '行业与会议', importance: '中', summary: '检查页面定位', impact: '检查条目高亮', source: '验证数据', tags: [], published: day, collected: day, deadline: day, url: 'https://example.com/desk-location-check' };
              data.agendaOnly = [...(data.agendaOnly || []), fixture];
              await page.route('**/clinical.json', route => route.fulfill({ json: data }));
              await page.goto('http://127.0.0.1:8765/');
              await page.locator('#feed article').first().waitFor();
              assert.equal(await page.title(), '临床统计编程信息看板 · Biometrics Desk');
              assert.deepEqual(await page.locator('#tabs button').allTextContents(), ['临床情报', '开源仓库']);
              await page.getByRole('button', { name: /开源仓库，/ }).click();
              await page.locator('.tick').first().focus();
              await page.locator('.tick').first().hover();
              const item = page.locator('.day-item').filter({ hasText: fixture.title });
              await item.hover();
              await item.click();
              assert.equal(await page.locator('#feed .located').count(), 1);
              assert.equal(await page.locator('#feed .located').getAttribute('data-record-url'), fixture.url);
              assert.ok(await page.locator('#feed .located').evaluate(element => document.activeElement === element));
              const sync = await page.locator('#updates .sync').last().innerText();
              assert.match(sync, /采集范围/);
              assert.doesNotMatch(sync, /pharmaverse|命中|关键词|采集开始|采集完成/);
              assert.equal(await page.locator('.wechat-promo strong').innerText(), '药企SP程序员Allen');
              assert.deepEqual(errors, []);
              console.log('PASS: title, two tabs, hovered item location, concise source notes, and WeChat recommendation');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Prepare public files
        run: |
          mkdir site
          cp index.html style.css app.js clinical.json repositories.json repositories-archive.json refresh-status.json site/
          chmod -R a+rX site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
