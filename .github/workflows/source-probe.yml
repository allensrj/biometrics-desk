name: Diagnose official sources
on: workflow_dispatch
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PHUSE official pagination requests
        run: |
          pip -q install playwright
          python -u <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(executable_path='/usr/bin/google-chrome')
            page=b.new_page()
            def record(r):
              if r.url=='https://cms.phuse.global/graphql':
                print(json.dumps({'url':r.url,'request':r.request.post_data,'response':r.text()[:16000]},ensure_ascii=False))
            page.on('response',record)
            page.goto('https://phuse.global/Communications/PHUSE_Blog',wait_until='networkidle')
            page.get_by_text('Next Page',exact=True).click()
            page.wait_for_timeout(2000)
            b.close()
          PY
