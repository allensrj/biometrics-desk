name: Diagnose official sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official APIs from GitHub
        run: |
          pip -q install beautifulsoup4 playwright
          python -u <<'PY'
          import json,urllib.request,concurrent.futures
          from bs4 import BeautifulSoup
          urls=[
          'https://admin.ich.org/api/v1/nodes?loadEntities%5B%5D=paragraph&bundle=news&limit=100&sort=date:DESC,created:desc',
          'https://www.fda.gov/files/api/datatables/static/search-for-fda-guidance-documents.json',
          'https://www.fda.gov/regulatory-information/search-fda-guidance-documents?sort_by=field_issued_date&sort_order=DESC',
          'https://www.fda.gov/drugs/guidances-drugs/newly-added-guidance-documents',
          'https://www.cde.org.cn/main/news/viewInfoCommon/e50c89621a69b8bffeaf90977d836f17',
          'https://www.cdisc.org/standards/foundational/dataset-json/controlled-terminology-package-62',
          'https://phuse.global/Communications/PHUSE_Blog',
          ]
          def inspect(url):
            try:
              raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=35).read().decode('utf-8','replace')
              if raw.lstrip().startswith(('{','[')):
                data=json.loads(raw)
                if isinstance(data,list): brief=data[:2]
                else: brief={k:(v[:2] if isinstance(v,list) else v) for k,v in data.items()}
                return {'url':url,'json':str(brief)[:16000]}
              doc=BeautifulSoup(raw,'html.parser')
              if 'PHUSE' in url:
                a=next(a for a in doc.select('a[href]') if 'human-review-still' in a['href'])
                return {'url':url,'parent':str(a.parent.parent.parent)[:12000], 'next':[(a.get('href'),a.get_text()) for a in doc.select('a[href]') if 'next' in a.get_text().lower()]}
              return {'url':url,'meta':[str(x) for x in doc.select('meta')][:35], 'text':doc.get_text(' ',strip=True)[-16000:], 'scripts':[(s.get('src') or s.get_text()[:2000]) for s in doc.select('script') if not s.get('r')][-20:]}
            except Exception as e: return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
            for result in ex.map(inspect,urls): print(json.dumps(result,ensure_ascii=False))
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(executable_path='/usr/bin/google-chrome')
            for url in ['https://www.ich.org/news','https://www.fda.gov/regulatory-information/search-fda-guidance-documents','https://www.cde.org.cn/']:
              page=b.new_page(); responses=[]
              page.on('response',lambda r: responses.append(r.url) if r.request.resource_type in ('xhr','fetch') else None)
              try:
                page.goto(url,wait_until='networkidle',timeout=50000)
                if 'cde.org' in url:
                  page.goto('https://www.cde.org.cn/main/news/listpage/3cc45b396497b598341ce3af000490e5',wait_until='networkidle',timeout=50000)
                print(json.dumps({'browser':url,'requests':responses,'text':page.locator('body').inner_text()[:3000]},ensure_ascii=False))
              except Exception as e: print(json.dumps({'browser':url,'requests':responses,'error':str(e)}))
              page.close()
            b.close()
          PY
