name: Diagnose official sources
on: workflow_dispatch
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official feed structure
        run: |
          pip -q install beautifulsoup4 playwright
          python -u <<'PY'
          import json,urllib.request,concurrent.futures
          from bs4 import BeautifulSoup
          urls=[
          'https://www.fda.gov/drugs/guidances-drugs/newly-added-guidance-documents?elq=4313ea2a710f4131af8e813ffd2ef83e',
          'https://www.fda.gov/industry/fda-data-standards-advisory-board/study-data-standards-resources',
          'https://www.cde.org.cn/main/news/listpage/3cc45b396497b598341ce3af000490e5',
          'https://phuse.global/Communications/PHUSE_Blog',
          'https://www.cdisc.org/news',
          'https://www.cdisc.org/events/webinars/upcoming']
          def inspect(url):
            try:
              raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
              doc=BeautifulSoup(raw,'html.parser')
              if 'PHUSE' in url:
                data=doc.select_one('#__NEXT_DATA__'); return {'url':url,'data':data.get_text()[:18000] if data else '', 'buttons':[str(x) for x in doc.select('button')][-12:]}
              if 'cdisc' in url:
                return {'url':url,'main':str(doc.select_one('main'))[:18000]}
              return {'url':url,'text':doc.get_text(' ',strip=True)[-16000:], 'tables':[str(x)[:14000] for x in doc.select('table')][:1]}
            except Exception as e: return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
            for x in ex.map(inspect,urls): print(json.dumps(x,ensure_ascii=False))
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(executable_path='/usr/bin/google-chrome')
            page=b.new_page(); requests=[]
            page.on('response',lambda r: requests.append(r.url) if r.request.resource_type in ('fetch','xhr') else None)
            page.goto('https://phuse.global/Communications/PHUSE_Blog',wait_until='networkidle')
            try:
              page.get_by_text('Next Page',exact=True).click(timeout=5000)
              page.wait_for_timeout(2000)
              print(json.dumps({'phuseNext':page.url,'requests':requests,'text':page.locator('body').inner_text()[-6000:]},ensure_ascii=False))
            except Exception as e: print(type(e).__name__)
            b.close()
          PY
